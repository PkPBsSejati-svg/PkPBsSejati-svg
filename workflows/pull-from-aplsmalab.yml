name: Pull latest from aplsmalab-svg/4535m3n

# Polls the source repo on a schedule and mirrors its file into this repo.
# No secrets/tokens needed: reading a public repo's raw file requires no
# auth, and pushing to THIS repo uses the default GITHUB_TOKEN.
on:
  schedule:
    - cron: "*/5 * * * *"   # every 5 minutes (GitHub's minimum interval)
  workflow_dispatch: {}       # lets you also trigger it manually from the Actions tab

permissions:
  contents: write

env:
  # EDIT THESE if the source repo's branch or filename is different
  SOURCE_RAW_URL: "https://raw.githubusercontent.com/aplsmalab-svg/4535m3n/main/menu_soal.html"
  TARGET_FILE: "qscdrtkju34okvbfdehmksbgtsbhushjwon12.html"

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Check out this repo
        uses: actions/checkout@v4

      - name: Download latest file from source repo
        run: curl -fsSL "$SOURCE_RAW_URL" -o "$TARGET_FILE.new"

      - name: Replace if changed, commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          if [ -f "$TARGET_FILE" ] && cmp -s "$TARGET_FILE" "$TARGET_FILE.new"; then
            echo "No changes — nothing to sync."
            rm "$TARGET_FILE.new"
          else
            mv "$TARGET_FILE.new" "$TARGET_FILE"
            git add "$TARGET_FILE"
            git commit -m "Auto-sync: pull latest from aplsmalab-svg/4535m3n"
            git push
          fi
